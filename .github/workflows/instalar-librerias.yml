name: Descarga Automatica de Librerias 3D

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python en el servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar libreria Requests
        run: pip install requests

      - name: Ejecutar script utilizando CDN de archivos estaticos
        run: |
          python -c '
          import os, requests
          os.makedirs("js", exist_ok=True)
          
          # Direcciones definitivas que contienen el codigo JavaScript clasico de la version r128
          librerias = {
              "js/three.min.js": "https://unpkg.com",
              "js/OrbitControls.js": "https://unpkg.com",
              "js/GLTFLoader.js": "https://unpkg.com"
          }
          
          # Simulamos un navegador limpio para evitar cualquier bloqueo por parte del servidor de descarga
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/javascript, application/javascript, */*"
          }
          
          for ruta, url in librerias.items():
              print(f"Descargando {ruta}...")
              res = requests.get(url, headers=headers, timeout=30)
              res.raise_for_status()
              
              contenido = res.text.strip()
              
              # Verificacion de seguridad: si devuelve codigo HTML o un error de texto, el script se detiene
              if contenido.startswith("<") or "Cannot find" in contenido or "Page Not Found" in contenido:
                  raise Exception(f"Error critico: La URL devolvio contenido corrupto o no valido para {ruta}")
                  
              with open(ruta, "w", encoding="utf-8") as f:
                  f.write(contenido)
          print("Librerias descargadas e inyectadas de forma limpia en la carpeta js/.")
          '

      - name: Guardar cambios en el repositorio de GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/
          git commit -m "Auto: Forzar descarga limpia de librerias de compatibilidad r128" && git push || echo "No hay cambios nuevos"
