name: Descarga Automatica de Librerias 3D

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python en el servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar libreria Requests
        run: pip install requests

      - name: Ejecutar script utilizando fuentes de GitHub
        run: |
          python -c '
          import os, requests
          os.makedirs("js", exist_ok=True)
          
          # Descarga directa desde el código fuente original del repositorio de mrdoob (Three.js) en GitHub
          # Usamos la versión de la rama r128 exacta para garantizar compatibilidad
          librerias = {
              "js/three.min.js": "https://githubusercontent.com",
              "js/OrbitControls.js": "https://githubusercontent.com",
              "js/GLTFLoader.js": "https://githubusercontent.com"
          }
          
          for ruta, url in librerias.items():
              print(f"Descargando {ruta} desde el repositorio principal de GitHub...")
              res = requests.get(url, timeout=30)
              res.raise_for_status()
              
              contenido = res.text.strip()
              if contenido.startswith("<") or "Page Not Found" in contenido:
                  raise Exception(f"Error crítico: La URL de GitHub devolvió un error para {ruta}")
                  
              with open(ruta, "w", encoding="utf-8") as f:
                  f.write(contenido)
          print("Librerias descargadas con éxito y de forma limpia desde GitHub.")
          '

      - name: Guardar cambios en el repositorio de GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/
          git commit -m "Auto: Forzar descarga limpia de librerias desde GitHub Source" && git push || echo "No hay cambios nuevos"
