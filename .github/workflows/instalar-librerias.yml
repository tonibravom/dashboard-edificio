name: Descarga Automatica de Librerias 3D

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python en el servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar libreria Requests
        run: pip install requests

      - name: Ejecutar script de descarga de fuentes estables
        run: |
          python -c '
          import os, requests
          os.makedirs("js", exist_ok=True)
          
          # URLs CDN de producción absolutas para evitar redirecciones HTML
          librerias = {
              "js/three.min.js": "https://cloudflare.com",
              "js/OrbitControls.js": "https://jsdelivr.net",
              "js/GLTFLoader.js": "https://jsdelivr.net"
          }
          
          # Forzamos cabecera de navegador para evitar bloqueos en el servidor de origen
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          
          for ruta, url in librerias.items():
              print(f"Descargando {ruta} desde {url}...")
              res = requests.get(url, headers=headers, timeout=30)
              res.raise_for_status()
              
              # Validación crítica: si empieza por "<", es un HTML de error y no lo guardamos
              contenido = res.text.strip()
              if contenido.startswith("<"):
                  raise Exception(f"Error crítico: La URL devolvió HTML en vez de JavaScript para {ruta}")
                  
              with open(ruta, "w", encoding="utf-8") as f:
                  f.write(contenido)
          print("Librerias descargadas con éxito de forma limpia.")
          '

      - name: Guardar cambios en el repositorio de GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add js/
          git commit -m "Auto: Reemplazar librerias 3D por codigo JS limpio" && git push || echo "No hay cambios nuevos"
