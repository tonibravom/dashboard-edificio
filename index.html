<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemelo Digital Avinyó 7</title>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI,sans-serif;
    background:#1a1a1a;
}

.dashboard{
    display:flex;
    width:100%;
    height:100%;
}

.columna{
    flex:1;
    border-right:1px solid #333;
    position:relative;
}

.columna:last-child{
    border-right:none;
}

#esquerra{
    background:#121212;
    padding:12px;
    color:white;
    overflow-y:auto;
}

#dreta{
    background:#121212;
    padding:20px;
    color:white;
}

#centre{
    background:#222;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

#loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    z-index:100;
}

.selector{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:6px;
}

.selector select{
    padding:5px;
}


#plantaActual{
    margin-top:15px;
    margin-bottom:15px;
    font-size:20px;
    font-weight:bold;
    color:#4caf50;
}

.sensor{
    background:#1f1f1f;
    border:1px solid #333;
    border-radius:8px;
    padding:8px;
    margin-bottom:8px;
}

.sensor .nom{
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
    color:#d0d0d0;
}


.sensor .valor{
    font-size:18px;
    font-weight:bold;
    color:#6ec6ff;
    word-wrap:break-word;
}


</style>

</head>

<body>

<div class="dashboard">

    <div class="columna" id="esquerra">
    <h2>Digital Twin</h2>

    <div id="plantaActual">
        Edifici
    </div>

    <div id="dadesSensors">

    <div class="sensor">
        <div class="nom">⚡ Energia consumida avui</div>
        <div id="energiaEdifici" class="valor">...</div>
    </div>

<div class="sensor">
    <div class="nom">
        🔌 Potència activa
    </div>
    <div id="potenciaActiva" class="valor">
        ...
    </div>
</div>

<div class="sensor">
    <div class="nom">
        📈 Factor de potència
    </div>
    <div id="factorPotencia" class="valor">
        ...
    </div>
</div>

    <div class="sensor">
        <div class="nom">🌡️ Temperatura mitjana edifici</div>
        <div id="temperaturaEdifici" class="valor">...</div>
    </div>

    <div class="sensor">
        <div class="nom">💧 Humitat relativa mitjana</div>
        <div id="humitatEdifici" class="valor">...</div>
    </div>

<div class="sensor">

    <div class="nom">
        🥧 Repartiment energètic
    </div>

    <canvas
        id="graficaEnergia"
        width="250"
        height="250">
    </canvas>

</div>

</div>
</div>

    <div class="columna" id="centre">

        <div id="loading">
            Carregant model...
        </div>

        <div class="selector">
            <select id="selectorPlanta">
                <option value="totes">Edifici complet</option>
            </select>
        </div>

        <canvas id="visor3d"></canvas>

    </div>

    <div class="columna" id="dreta">
        <h2>Històrics</h2>
    </div>

</div>

<script>

let model = null;
const plantes = new Set();

const container = document.getElementById("centre");
const canvas = document.getElementById("visor3d");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth/container.clientHeight,
    0.1,
    10000
);

camera.position.set(20,20,20);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

async function llegirSensor(path){

    const resposta = await fetch(path);

    if(!resposta.ok){
        throw new Error(path);
    }

    return await resposta.json();

}



controls.enableDamping = true;

scene.add(
    new THREE.AmbientLight(0xffffff,0.8)
);

const light1 = new THREE.DirectionalLight(
    0xffffff,
    1
);

light1.position.set(20,30,20);

scene.add(light1);

const light2 = new THREE.DirectionalLight(
    0xffffff,
    0.5
);

light2.position.set(-20,20,-20);

scene.add(light2);


async function energiaDia(fitxer){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    return dades.values.reduce(
        (a,b)=>a+b,
        0
    );

}


async function carregarIndicadorsEdifici(){

    try{

        /* =======================
           ENERGIA
           ======================= */

        const energia =
    await llegirSensor(
        "datos_sensores/0190_MV_C1_ASB_ACTIVEE.json"
    );

const consumAvui =
    energia.values.reduce(
        (a,b) => a+b,
        0
    );


document.getElementById(
    "energiaEdifici"
).innerHTML =
    consumAvui.toFixed(0)
    + " kWh";


const potencia =
    await llegirSensor(
        "datos_sensores/0190_HV_C1_ASB_ACTIVEP.json"
    );

const potenciaActual =
    potencia.values[
        potencia.values.length - 1
    ];

document.getElementById(
    "potenciaActiva"
).innerHTML =
    potenciaActual.toFixed(1)
    + " kW";

const fp =
    await llegirSensor(
        "datos_sensores/0190_HV_C1_ASB_PFACTOR.json"
    );

const fpActual =
    fp.values[
        fp.values.length - 1
    ];

document.getElementById(
    "factorPotencia"
).innerHTML =
    fpActual.toFixed(3);


const energiaPlantes =

      await energiaDia(
      "0190_MV_C10_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C20_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C30_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C40_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C50_CGEM21_EACTIVA.json"
      );

const energiaClima =

      await energiaDia(
      "0190_MV_C2_ASB_ACTIVEE.json"
      )

    + await energiaDia(
      "0190_MV_C41_CGEM21_EACTIVA.json"
      );

const energiaAltres =

    consumAvui

    - energiaPlantes

    - energiaClima;

const pctPlantes =

    energiaPlantes
    / consumAvui
    * 100;

const pctClima =

    energiaClima
    / consumAvui
    * 100;

const pctAltres =

    energiaAltres
    / consumAvui
    * 100;


new Chart(

    document
    .getElementById(
        "graficaEnergia"
    ),

    {
        type:"pie",

        data:{

            labels:[
                "Plantes",
                "Climatització",
                "Altres"
            ],

            datasets:[{

                data:[
                    pctPlantes,
                    pctClima,
                    pctAltres
                ],

                backgroundColor:[

                    "#4caf50",
                    "#2196f3",
                    "#ff9800"

                ]

            }]

        },

        options:{

            responsive:true,

            plugins:{

                legend:{
                    position:"bottom"
                }

            }

        }

    }

);

        /* =======================
           TEMPERATURA
           ======================= */

        const sensorsTemp = [

    "0190_HV_S1_STPRO_TEMP.json",
    "0190_HV_S2_STPRO_TEMP.json",
    "0190_HV_S3_STPRO_TEMP.json",
    "0190_HV_S4_STPRO_TEMP.json",
    "0190_HV_S5_STPRO_TEMP.json"

];

let sumaTemp = 0;

for(const fitxer of sensorsTemp){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    const ultimValor =
        dades.values[
            dades.values.length - 1
        ];

    sumaTemp += Number(ultimValor);

}

const temperaturaMitjana =
    sumaTemp /
    sensorsTemp.length;

document.getElementById(
    "temperaturaEdifici"
).innerHTML =
    temperaturaMitjana.toFixed(1)
    + " °C";

        /* =======================
           HUMITAT
           ======================= */

       const sensorsHum = [

    "0190_HV_S1_STPRO_HUM.json",
    "0190_HV_S2_STPRO_HUM.json",
    "0190_HV_S3_STPRO_HUM.json",
    "0190_HV_S4_STPRO_HUM.json",
    "0190_HV_S5_STPRO_HUM.json"

];

let sumaHum = 0;

for(const fitxer of sensorsHum){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    const ultimValor =
        dades.values[
            dades.values.length - 1
        ];

    sumaHum += Number(ultimValor);

}

const humitatMitjana =
    sumaHum /
    sensorsHum.length;

document.getElementById(
    "humitatEdifici"
).innerHTML =
    humitatMitjana.toFixed(1)
    + " %";
    }
    catch(error){
        console.error(
            "Error carregant indicadors",
            error
        );
    }
}

/* ---------- carregar model ---------- */

const loader = new THREE.GLTFLoader();

loader.load(

    "avinyo7edifici.glb",

    function(gltf){

        document.getElementById("loading").style.display="none";

        model = gltf.scene;

        scene.add(model);

        const box =
            new THREE.Box3().setFromObject(model);

        const center =
            box.getCenter(new THREE.Vector3());

        const size =
            box.getSize(new THREE.Vector3());

        controls.target.copy(center);

        camera.position.set(
            center.x + size.x,
            center.y + size.y,
            center.z + size.z
        );

        controls.update();

        detectarPlantes();

        generarSelector();

        carregarIndicadorsEdifici();

        console.log("Model carregat correctament");
    },

    undefined,

    function(error){

        console.error(error);

        document.getElementById("loading").innerHTML =
            "Error carregant avinyo7edifici.glb";
    }

);

/* ---------- detectar plantes ---------- */

function obtenirPlanta(y){

    if(y < -11.2){
        return "Soterrani";
    }

    if(y <= -6.90){
        return "Planta Baixa";
    }

    if(y <= -0.70){
        return "Planta 1";
    }

    if(y <= 3.95){
        return "Planta 2";
    }

    if(y <= 10.95){
        return "Planta 3";
    }

    if(y <= 16.20){
        return "Planta 4";
    }

    if(y <= 20.00){
        return "Planta 5";
    }

    return "Coberta";
}


function detectarPlantes(){

    plantes.clear();

    model.traverse(function(node){

        if(!node.isMesh) return;

        const box =
            new THREE.Box3().setFromObject(node);

        const center =
            box.getCenter(new THREE.Vector3());

        const planta =
            obtenirPlanta(center.y);

        node.userData.planta = planta;

        plantes.add(planta);

        console.log(
            node.name + " -> " +
            planta +
            " (Y=" +
            center.y.toFixed(2) +
            ")"
        );

    });

}

/* ---------- selector ---------- */


function generarSelector(){

    const select =
        document.getElementById("selectorPlanta");

    select.innerHTML =
        '<option value="totes">Edifici complet</option>';

    const ordre = [
        "Soterrani",
        "Planta Baixa",
        "Planta 1",
        "Planta 2",
        "Planta 3",
        "Planta 4",
        "Planta 5",
        "Coberta"
    ];

    ordre.forEach(planta => {

        if(!plantes.has(planta)) return;

        const option =
            document.createElement("option");

        option.value = planta;
        option.textContent = planta;

        select.appendChild(option);

    });

}


document
.getElementById("selectorPlanta")
.addEventListener("change",function(){

    const planta = this.value;

    

    if(!model) return;

    model.traverse(function(node){

        if(!node.isMesh) return;

        if(planta==="totes"){

            node.visible=true;
            return;
        }

        if(planta === "totes"){

    		node.visible = true;

		} else {

    		node.visible =
        	node.userData.planta === planta;

		}

    });

});

function mostrarSensors(planta){

    document.getElementById(
        "plantaActual"
    ).textContent = planta;

    const contenidor =
        document.getElementById(
            "dadesSensors"
        );

    contenidor.innerHTML = "";

    if(planta === "totes"){

        contenidor.innerHTML =
            "<p>Seleccioneu una planta.</p>";

        return;
    }

    const sensors =
        sensorsPerPlanta[planta];

    if(!sensors){

        contenidor.innerHTML =
            "<p>No hi ha sensors associats.</p>";

        return;
    }

    sensors.forEach(sensor => {

        const div =
            document.createElement("div");

        div.className =
            "sensor";

        div.innerHTML = `
            <div class="nom">
                ${sensor.nom}
            </div>

            <div class="valor">
                ${sensor.valor}
                ${sensor.unitat}
            </div>
        `;

        contenidor.appendChild(div);

    });

}


/* ---------- render ---------- */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);

}

animate();

/* ---------- resize ---------- */

window.addEventListener("resize",()=>{

    camera.aspect =
        container.clientWidth/
        container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

});
loader.load("avinyo7edifici.glb", function(gltf){

    console.log("ARBRE DEL MODEL");



    gltf.scene.traverse((obj)=>{

    if(obj.isMesh){

        const box =
            new THREE.Box3()
            .setFromObject(obj);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );

        console.log(
            obj.name,
            "Z =",
            center.z
        );
    }

});
    
});


</script>

</body>
</html>
