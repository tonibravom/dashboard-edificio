<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUILDING MONITOR Carrer Avinyó, 7</title>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI,sans-serif;
    background:#1a1a1a;
}

.dashboard{
    display:flex;
    width:100vw;
    height:100vh;
    background:#f4f7fb;
}

#panelDatos{

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:420px;

    overflow-y:auto;

    padding:20px;

    background:#f4f7fb;

}
.kpi-card{
    background:#ffffff;
    border-radius:10px;
    padding:8px;
    margin-bottom:6px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
    border:1px solid #dfe7ef;
}
.kpi-title{
    color:#56657a;
    font-size:11px;
    margin-bottom:3px;
    font-weight:600;
}
.kpi-value{
    font-size:16px;
    font-weight:700;
    color:#14213d;
}
.columna:last-child{
    border-right:none;
}



canvas{
    width:100%;
    height:100%;
    display:block;
}

#loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    z-index:100;
}

.selector{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:6px;
}

.selector select{
    padding:5px;
}


#visorContainer{

    position:absolute;

    left:420px;
    top:0;
    right:0;
    bottom:0;

}

#visor3d{

    width:100%;
    height:100%;
    display:block;

}


#graficaEnergia{
    width:110px !important;
    height:110px !important;
    margin:0 auto;
}

.kpi-row{

    display:flex;

    gap:10px;

}


.clima-row{

    display:flex;

    gap:10px;

}

.clima-row .kpi-card{

    flex:1;

}

.mini-kpi{

    flex:1;

    text-align:center;

}

.mini-title{

    font-size:11px;

    color:#56657a;

    margin-bottom:4px;

}

.mini-value{

    font-size:14px;

    font-weight:700;

    color:#14213d;

}

#mixLeyenda{

    margin-top:15px;

}

.mix-item{
    display:flex;
    align-items:center;
    margin-bottom:3px;
    font-size:11px;
    color:#56657a;
}
.mix-color{

    width:12px;

    height:12px;

    border-radius:50%;

    margin-right:8px;

}

.color-plantes{
    background:#2e7d32;
}

.color-clima{
    background:#1976d2;
}

.color-altres{
    background:#ef6c00;
}




</style>

</head>

<body>

<div id="panelDatos">


    <div class="kpi-card">

        <div class="kpi-title">
            ⚡ Energía total consumida HOY
        </div>

        <div
            id="ed_energia"
            class="kpi-value">
            --
        </div>

    </div>

    <div class="kpi-card">

    	<div class="kpi-title">
        	🥧 MIX CONSUMO HOY
    	</div>

    	<canvas
    		id="graficaEnergia"
   		 width="140"
    		height="140">
    	</canvas>

    <div id="mixLeyenda">

    	<div class="mix-item">

        	<span class="mix-color color-plantes"></span>

        	<span id="lblPlantes">
            	Energía plantas
        	</span>

    	</div>

    	<div class="mix-item">

        	<span class="mix-color color-clima"></span>

        	<span id="lblClima">
            	Energía climatitzación
        	</span>

    	</div>

    	<div class="mix-item">

        	<span class="mix-color color-altres"></span>

        	<span id="lblAltres">
            	Energía Otros
        	</span>

    	</div>

     </div>

</div>



<div class="kpi-card">

    <div class="kpi-row">

        <div class="mini-kpi">

            <div class="mini-title">
                🔌 Potencia
            </div>

            <div
                id="potenciaActiva"
                class="mini-value">

                --

            </div>

        </div>

        <div class="mini-kpi">

            <div class="mini-title">
                📈 cos&#946
            </div>

            <div
                id="factorPotencia"
                class="mini-value">

                --

            </div>

        </div>

    </div>

</div>
    
    <div class="clima-row">

	<div class="kpi-card">

        <div class="kpi-title">
            🌡 Temperatura media plantas
        </div>

        <div
            id="ed_temp"
            class="kpi-value">
            --
        </div>

    </div>

    <div class="kpi-card">

        <div class="kpi-title">
            💧 Humedad relativa media plantas
        </div>

        <div
            id="ed_hum"
            class="kpi-value">
            --
        </div>

    </div>

</div>

</div>

<div id="visorContainer">

    <div class="selector">

        <label>
            Planta
        </label>

        <select id="selectorPlanta">
            <option>Edifici complet</option>
        </select>

    </div>

    <canvas id="visor3d"></canvas>

</div>



<script>

let model = null;
const plantes = new Set();

let graficaMix = null;
const container = document.getElementById("visorContainer");
const canvas = document.getElementById("visor3d");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8edf3);

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth/container.clientHeight,
    0.1,
    10000
);

camera.position.set(20,20,20);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

async function llegirSensor(path){

    const resposta = await fetch(path);

    if(!resposta.ok){
        throw new Error(path);
    }

    return await resposta.json();

}



controls.enableDamping = true;

scene.add(
    new THREE.AmbientLight(0xffffff,0.8)
);

const light1 = new THREE.DirectionalLight(
    0xffffff,
    1
);

light1.position.set(20,30,20);

scene.add(light1);

const light2 = new THREE.DirectionalLight(
    0xffffff,
    0.5
);

light2.position.set(-20,20,-20);

scene.add(light2);


async function energiaDia(fitxer){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    return dades.values.reduce(
        (a,b)=>a+b,
        0
    );

}


async function carregarIndicadorsEdifici(){

    try{

        /* =======================
           ENERGIA
           ======================= */

        const energia =
    await llegirSensor(
        "datos_sensores/0190_MV_C1_ASB_ACTIVEE.json"
    );

const consumAvui =
    energia.values.reduce(
        (a,b) => a+b,
        0
    );


document.getElementById(
    "ed_energia"
).innerHTML =
    consumAvui.toFixed(0)
    + " kWh";


const potencia =
    await llegirSensor(
        "datos_sensores/0190_HV_C1_ASB_ACTIVEP.json"
    );

const potenciaActual =
    potencia.values[
        potencia.values.length - 1
    ];

document.getElementById(
    "potenciaActiva"
).innerHTML =
    potenciaActual.toFixed(1)
    + " kW";

const fp =
    await llegirSensor(
        "datos_sensores/0190_HV_C1_ASB_PFACTOR.json"
    );

const fpActual =
    fp.values[
        fp.values.length - 1
    ];

document.getElementById(
    "factorPotencia"
).innerHTML =
    fpActual.toFixed(3);


const energiaPlantes =

      await energiaDia(
      "0190_MV_C10_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C20_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C30_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C40_CGEM21_EACTIVA.json"
      )

    + await energiaDia(
      "0190_MV_C50_CGEM21_EACTIVA.json"
      );

const energiaClima =

      await energiaDia(
      "0190_MV_C2_ASB_ACTIVEE.json"
      )

    + await energiaDia(
      "0190_MV_C41_CGEM21_EACTIVA.json"
      );

const energiaAltres =

    consumAvui

    - energiaPlantes

    - energiaClima;

const pctPlantes =

    energiaPlantes
    / consumAvui
    * 100;

const pctClima =

    energiaClima
    / consumAvui
    * 100;

const pctAltres =

    energiaAltres
    / consumAvui
    * 100;


document.getElementById(
    "lblPlantes"
).innerHTML =

    "Energía plantas: "
    + energiaPlantes.toFixed(0)
    + " kWh ("
    + pctPlantes.toFixed(0)
    + "%)";

document.getElementById(
    "lblClima"
).innerHTML =

    "Energía climatitzación: "
    + energiaClima.toFixed(0)
    + " kWh ("
    + pctClima.toFixed(0)
    + "%)";

document.getElementById(
    "lblAltres"
).innerHTML =

    "Energía Otros: "
    + energiaAltres.toFixed(0)
    + " kWh ("
    + pctAltres.toFixed(0)
    + "%)";





if(graficaMix){

    graficaMix.destroy();

}

graficaMix = new Chart(

    document.getElementById(
        "graficaEnergia"
    ),

    {

        type:"doughnut",

        data:{

            labels:[
                "Plantes",
                "Climatització",
                "Altres"
            ],

            datasets:[{

                data:[
                    pctPlantes,
                    pctClima,
                    pctAltres
                ],

                backgroundColor:[
                    "#2e7d32",
                    "#1976d2",
                    "#ef6c00"
                ],

                borderWidth:0

            }]

        },

        options:{

            cutout:"65%",

            responsive:true,

            plugins:{

                legend:{
                    display:false
                }

            }

        }

    }

);

        /* =======================
           TEMPERATURA
           ======================= */

        const sensorsTemp = [

    "0190_HV_S1_STPRO_TEMP.json",
    "0190_HV_S2_STPRO_TEMP.json",
    "0190_HV_S3_STPRO_TEMP.json",
    "0190_HV_S4_STPRO_TEMP.json",
    "0190_HV_S5_STPRO_TEMP.json"

];

let sumaTemp = 0;

for(const fitxer of sensorsTemp){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    const ultimValor =
        dades.values[
            dades.values.length - 1
        ];

    sumaTemp += Number(ultimValor);

}

const temperaturaMitjana =
    sumaTemp /
    sensorsTemp.length;

document.getElementById(
    "ed_temp"
).innerHTML =
    temperaturaMitjana.toFixed(1)
    + " °C";

        /* =======================
           HUMITAT
           ======================= */

       const sensorsHum = [

    "0190_HV_S1_STPRO_HUM.json",
    "0190_HV_S2_STPRO_HUM.json",
    "0190_HV_S3_STPRO_HUM.json",
    "0190_HV_S4_STPRO_HUM.json",
    "0190_HV_S5_STPRO_HUM.json"

];

let sumaHum = 0;

for(const fitxer of sensorsHum){

    const dades =
        await llegirSensor(
            "datos_sensores/" + fitxer
        );

    const ultimValor =
        dades.values[
            dades.values.length - 1
        ];

    sumaHum += Number(ultimValor);

}

const humitatMitjana =
    sumaHum /
    sensorsHum.length;

document.getElementById(
    "ed_hum"
).innerHTML =
    humitatMitjana.toFixed(1)
    + " %";
    }
    catch(error){
        console.error(
            "Error carregant indicadors",
            error
        );
    }
}

/* ---------- carregar model ---------- */

const loader = new THREE.GLTFLoader();

loader.load(

    "avinyo7edifici.glb",

    function(gltf){

        const loading =
    document.getElementById("loading");

if(loading){
    loading.style.display = "none";
}

        model = gltf.scene;

        scene.add(model);

        const box =
            new THREE.Box3().setFromObject(model);

        const center =
            box.getCenter(new THREE.Vector3());

        const size =
            box.getSize(new THREE.Vector3());

        controls.target.copy(center);

        camera.position.set(
            center.x + size.x,
            center.y + size.y,
            center.z + size.z
        );

        controls.update();

        detectarPlantes();

        generarSelector();

        carregarIndicadorsEdifici();

        console.log("Model carregat correctament");
    },

    undefined,

    function(error){

        console.error(error);

        document.getElementById("loading").innerHTML =
            "Error carregant avinyo7edifici.glb";
    }

);

/* ---------- detectar plantes ---------- */

function obtenirPlanta(y){

    if(y < -11.2){
        return "Soterrani";
    }

    if(y <= -6.90){
        return "Planta Baixa";
    }

    if(y <= -0.70){
        return "Planta 1";
    }

    if(y <= 3.95){
        return "Planta 2";
    }

    if(y <= 10.95){
        return "Planta 3";
    }

    if(y <= 16.20){
        return "Planta 4";
    }

    if(y <= 20.00){
        return "Planta 5";
    }

    return "Coberta";
}


function detectarPlantes(){

    plantes.clear();

    model.traverse(function(node){

        if(!node.isMesh) return;

        const box =
            new THREE.Box3().setFromObject(node);

        const center =
            box.getCenter(new THREE.Vector3());

        const planta =
            obtenirPlanta(center.y);

        node.userData.planta = planta;

        plantes.add(planta);

        console.log(
            node.name + " -> " +
            planta +
            " (Y=" +
            center.y.toFixed(2) +
            ")"
        );

    });

}

/* ---------- selector ---------- */


function generarSelector(){

    const select =
        document.getElementById("selectorPlanta");

    select.innerHTML =
        '<option value="totes">Edifici complet</option>';

    const ordre = [
        "Soterrani",
        "Planta Baixa",
        "Planta 1",
        "Planta 2",
        "Planta 3",
        "Planta 4",
        "Planta 5",
        "Coberta"
    ];

    ordre.forEach(planta => {

        if(!plantes.has(planta)) return;

        const option =
            document.createElement("option");

        option.value = planta;
        option.textContent = planta;

        select.appendChild(option);

    });

}


document
.getElementById("selectorPlanta")
.addEventListener("change",function(){

    const planta = this.value;

    

    if(!model) return;

    model.traverse(function(node){

        if(!node.isMesh) return;

        if(planta==="totes"){

            node.visible=true;
            return;
        }

        if(planta === "totes"){

    		node.visible = true;

		} else {

    		node.visible =
        	node.userData.planta === planta;

		}

    });

});


/* ---------- render ---------- */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);

}

animate();

/* ---------- resize ---------- */

window.addEventListener("resize",()=>{

    camera.aspect =
        container.clientWidth/
        container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

});


</script>

</body>
</html>
