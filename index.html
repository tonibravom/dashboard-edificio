<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemelo Digital Avinyó 7</title>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI,sans-serif;
    background:#1a1a1a;
}

.dashboard{
    display:flex;
    width:100%;
    height:100%;
}

.columna{
    flex:1;
    border-right:1px solid #333;
    position:relative;
}

.columna:last-child{
    border-right:none;
}

#esquerra{
    background:#121212;
    padding:20px;
    color:white;
}

#dreta{
    background:#121212;
    padding:20px;
    color:white;
}

#centre{
    background:#222;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

#loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    z-index:100;
}

.selector{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:6px;
}

.selector select{
    padding:5px;
}

</style>

</head>

<body>

<div class="dashboard">

    <div class="columna" id="esquerra">
        <h2>Dades actuals</h2>
    </div>

    <div class="columna" id="centre">

        <div id="loading">
            Carregant model...
        </div>

        <div class="selector">
            <select id="selectorPlanta">
                <option value="totes">Edifici complet</option>
            </select>
        </div>

        <canvas id="visor3d"></canvas>

    </div>

    <div class="columna" id="dreta">
        <h2>Històrics</h2>
    </div>

</div>

<script>

let model = null;
const plantes = new Set();

const container = document.getElementById("centre");
const canvas = document.getElementById("visor3d");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth/container.clientHeight,
    0.1,
    10000
);

camera.position.set(20,20,20);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

scene.add(
    new THREE.AmbientLight(0xffffff,0.8)
);

const light1 = new THREE.DirectionalLight(
    0xffffff,
    1
);

light1.position.set(20,30,20);

scene.add(light1);

const light2 = new THREE.DirectionalLight(
    0xffffff,
    0.5
);

light2.position.set(-20,20,-20);

scene.add(light2);

/* ---------- carregar model ---------- */

const loader = new THREE.GLTFLoader();

loader.load(

    "avinyo7edifici.glb",

    function(gltf){

        document.getElementById("loading").style.display="none";

        model = gltf.scene;

        scene.add(model);

        const box =
            new THREE.Box3().setFromObject(model);

        const center =
            box.getCenter(new THREE.Vector3());

        const size =
            box.getSize(new THREE.Vector3());

        controls.target.copy(center);

        camera.position.set(
            center.x + size.x,
            center.y + size.y,
            center.z + size.z
        );

        controls.update();

        detectarPlantes();

        generarSelector();

        console.log("Model carregat correctament");
    },

    undefined,

    function(error){

        console.error(error);

        document.getElementById("loading").innerHTML =
            "Error carregant avinyo7edifici.glb";
    }

);

/* ---------- detectar plantes ---------- */

function detectarPlantes(){

    model.traverse(function(node){

        if(!node.isMesh) return;

        let parent = node;

        while(parent){

            const nom = parent.name || "";

            if(
                nom.includes("Level") ||
                nom.includes("Nivel") ||
                nom.includes("Planta") ||
                nom.includes("Floor")
            ){

                plantes.add(nom);

                node.userData.planta = nom;

                break;
            }

            parent = parent.parent;
        }

    });

}

/* ---------- selector ---------- */

function generarSelector(){

    const select =
        document.getElementById("selectorPlanta");

    [...plantes]
        .sort()
        .forEach(planta=>{

            const option =
                document.createElement("option");

            option.value = planta;
            option.textContent = planta;

            select.appendChild(option);

        });

}

document
.getElementById("selectorPlanta")
.addEventListener("change",function(){

    const planta = this.value;

    if(!model) return;

    model.traverse(function(node){

        if(!node.isMesh) return;

        if(planta==="totes"){

            node.visible=true;
            return;
        }

        node.visible =
            node.userData.planta === planta;

    });

});

/* ---------- render ---------- */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);

}

animate();

/* ---------- resize ---------- */

window.addEventListener("resize",()=>{

    camera.aspect =
        container.clientWidth/
        container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

});
loader.load("avinyo7edifici.glb", function(gltf){

    console.log("ARBRE DEL MODEL");

    gltf.scene.traverse((obj)=>{

        console.log(
            obj.type,
            obj.name
        );

    });

});

});
</script>

</body>
</html>
